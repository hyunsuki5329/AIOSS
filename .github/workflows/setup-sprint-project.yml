name: Setup GitHub Project & Sprint Metrics

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'setup-project'
        type: choice
        options:
          - setup-project
          - generate-metrics

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  setup-project:
    if: ${{ github.event.inputs.action == 'setup-project' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup GitHub Project, Labels, Milestones & Issues
        shell: pwsh
        run: |
          $token = "${{ secrets.PROJECT_PAT }}"
          if ([string]::IsNullOrWhiteSpace($token)) {
            $token = "${{ secrets.AIOSS_TOKEN }}"
          }

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "PROJECT_PAT or AIOSS_TOKEN secret is required for Project V2 creation. Create PAT with repo + project scopes."
          }

          .\scripts\bootstrap-github-project.ps1 `
            -Repo "${{ github.repository }}" `
            -Token $token

  generate-metrics:
    if: ${{ github.event.inputs.action == 'generate-metrics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - name: Generate Sprint Metrics (Cycle Time, Velocity, Burndown)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node ./scripts/sprint-metrics.mjs
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-metrics
          path: artifacts/
          retention-days: 30
      
      - name: Display Report
        run: cat artifacts/sprint-metrics-report.md 2>/dev/null || echo "No report generated"
