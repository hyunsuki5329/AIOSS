name: CI

on:
  push:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 18, 20]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  secret-check:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Validate API_KEY secret mapping
        env:
          API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          if [ -z "${API_KEY}" ]; then
            echo "::error::API_KEY secret is not configured. Set it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secret loaded successfully."
