name: CI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and install dependencies
        id: setup
        uses: ./.github/actions/node-setup
        with:
          node-version: 20
          cache: true

      - name: Lint
        run: npm run lint

      - name: Build artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item package.json dist/package.json
          @(
            "build-time=$([DateTime]::UtcNow.ToString('o'))"
            "node-version=$(node --version)"
            "cache-hit=${{ steps.setup.outputs.cache-hit }}"
            "install-ms=${{ steps.setup.outputs.install-ms }}"
          ) | Set-Content dist/build-meta.txt -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/node-validate.yml
    with:
      node-version: ${{ matrix.node-version }}
      os: ${{ matrix.os }}
      cache: true
      run-lint: true
      run-test: true

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deployable file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            deployable:
              - 'dashboard/**'
              - 'grafana/**'
              - 'prometheus/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            docs_only:
              - 'docs/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'

  deploy-preview:
    needs: [build, test, detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Preview deployment
        shell: bash
        run: |
          echo "Preview deployment for PR #${{ github.event.pull_request.number }}"
          ls -la dist

  deploy:
    needs: [build, test, detect-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Deploy
        shell: bash
        run: |
          echo "Deploying artifact from dist/"
          ls -la dist
