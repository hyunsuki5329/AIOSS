name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Build artifact
        shell: bash
        run: |
          mkdir -p dist
          cp package.json dist/package.json
          echo "build-time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-meta.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 18, 20]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  secret-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Validate API_KEY secret mapping
        env:
          API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          if [ -z "${API_KEY}" ]; then
            echo "::error::API_KEY secret is not configured. Set it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secret loaded successfully."

  deploy:
    runs-on: ubuntu-latest
    needs: [test, secret-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Deploy
        shell: bash
        run: |
          echo "Deploying artifact from dist/"
          ls -la dist
