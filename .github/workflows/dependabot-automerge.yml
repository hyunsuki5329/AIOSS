name: Dependabot auto merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for safe dependency updates
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const labels = pullRequest.labels.map((label) => label.name);
            const isDependencyUpdate = labels.includes('dependencies') || labels.includes('npm') || labels.includes('github-actions');
            const isMajorUpdate = /major/i.test(pullRequest.title);

            if (!isDependencyUpdate || isMajorUpdate || pullRequest.draft) {
              core.info('Auto-merge conditions not met.');
              return;
            }

            await github.graphql(`
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }
            `, {
              pullRequestId: pullRequest.node_id,
            });

            core.info(`Enabled auto-merge for PR #${pullRequest.number}`);