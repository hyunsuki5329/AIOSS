name: Deploy dashboard to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'Dockerfile.web'
      - 'fly.toml'
      - '.github/workflows/fly-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --config fly.toml

      - name: Verify deployed dashboard
        shell: bash
        run: |
          curl -fsSL https://aioss-dashboard-hyunsuki5329.fly.dev/ | grep -q 'DORA Metrics Dashboard'