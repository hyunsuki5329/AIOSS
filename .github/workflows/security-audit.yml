name: Dependency security audit

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          node-version: 20
          cache: true

      - name: Run npm audit
        id: audit
        shell: bash
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json

      - name: Summarize audit result and manage issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'npm-audit.json';
            const date = new Date().toISOString().slice(0, 10);
            let report = { metadata: { vulnerabilities: {} }, vulnerabilities: {} };

            if (fs.existsSync(path)) {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            }

            const vulns = report.metadata?.vulnerabilities ?? {};
            const total = Object.values(vulns).reduce((sum, value) => sum + Number(value || 0), 0);
            const body = [
              `# Dependency security audit - ${date}`,
              '',
              `- Total vulnerabilities: ${total}`,
              `- Critical: ${vulns.critical ?? 0}`,
              `- High: ${vulns.high ?? 0}`,
              `- Moderate: ${vulns.moderate ?? 0}`,
              `- Low: ${vulns.low ?? 0}`,
              '',
              '## Raw report',
              '```json',
              JSON.stringify(report.metadata ?? report, null, 2),
              '```'
            ].join('\n');

            const issueLabels = ['security-audit', 'dependencies'];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-audit',
            });

            if (total > 0) {
              if (issues.length > 0) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues[0].number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `Security audit findings - ${date}`,
                  body,
                  labels: issueLabels,
                });
              }
            }

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json