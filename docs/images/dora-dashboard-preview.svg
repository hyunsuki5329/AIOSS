<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DORA dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff1dc"/>
      <stop offset="100%" stop-color="#ffe4c6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="60" y="90" font-family="Segoe UI, Arial" font-size="44" fill="#412a12" font-weight="700">DORA Metrics Dashboard</text>
  <text x="60" y="130" font-family="Segoe UI, Arial" font-size="24" fill="#6b4e2f">Lead Time / Deployment Frequency / MTTR / Change Failure Rate</text>

  <g font-family="Segoe UI, Arial" fill="#2f2113">
    <rect x="60" y="170" width="250" height="140" rx="16" fill="#fffaf3" stroke="#d8c2a2"/>
    <text x="84" y="214" font-size="20">Lead Time (avg)</text>
    <text x="84" y="266" font-size="42" font-weight="700">18.5h</text>

    <rect x="330" y="170" width="250" height="140" rx="16" fill="#fffaf3" stroke="#d8c2a2"/>
    <text x="354" y="214" font-size="20">Deploy/day</text>
    <text x="354" y="266" font-size="42" font-weight="700">0.42</text>

    <rect x="600" y="170" width="250" height="140" rx="16" fill="#fffaf3" stroke="#d8c2a2"/>
    <text x="624" y="214" font-size="20">MTTR</text>
    <text x="624" y="266" font-size="42" font-weight="700">2.1h</text>

    <rect x="870" y="170" width="250" height="140" rx="16" fill="#fffaf3" stroke="#d8c2a2"/>
    <text x="894" y="214" font-size="20">CFR</text>
    <text x="894" y="266" font-size="42" font-weight="700">9.8%</text>
  </g>

  <rect x="60" y="340" width="1060" height="220" rx="18" fill="#fffaf3" stroke="#d8c2a2"/>
  <g fill="#c86e45">
    <rect x="140" y="450" width="130" height="90" rx="8"/>
    <rect x="360" y="500" width="130" height="40" rx="8"/>
    <rect x="580" y="470" width="130" height="70" rx="8"/>
    <rect x="800" y="420" width="130" height="120" rx="8"/>
  </g>
  <g font-family="Segoe UI, Arial" font-size="18" fill="#65452c">
    <text x="138" y="575">Lead Time</text>
    <text x="338" y="575">Deploy/day</text>
    <text x="588" y="575">MTTR</text>
    <text x="832" y="575">CFR</text>
  </g>
</svg>
